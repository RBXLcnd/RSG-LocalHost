name: Build exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build app (onedir)
        run: >
          pyinstaller --noconfirm --clean --noconsole --onedir
          --name "RSG LocalHost" --icon icon.ico
          --add-data "app/assets;app/assets" --add-data "app/styles;app/styles" main.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+(\.\d+)*$') { $ver = "0.0.0" }
          & $iscc "/DAppVersion=$ver" installer\RSG-LocalHost.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash "installer_out/RSG-LocalHost-Setup.exe" -Algorithm SHA256).Hash
          "SHA-256 (RSG-LocalHost-Setup.exe): $h" | Out-File -FilePath hash.txt -Encoding utf8
          Get-Content hash.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RSG-LocalHost-Setup
          path: installer_out/RSG-LocalHost-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_out/RSG-LocalHost-Setup.exe
          body_path: hash.txt
          generate_release_notes: true
